name: Автономные проверки аудитора
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: bash scripts/setup_environment.sh
      - run: .venv/bin/python scripts/build_release.py
      - run: .venv/bin/python scripts/check_packages.py
      - name: Проверка исходного архива на секреты
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/gitleaks /tmp/public-source
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
          tar -xzf dist/vps_opsec_auditor-0.1.0a2.tar.gz -C /tmp/public-source
          /tmp/gitleaks/gitleaks dir /tmp/public-source --no-banner --redact
      - run: |
          python -m venv /tmp/vps-wheel-test
          /tmp/vps-wheel-test/bin/python -m pip install --no-index --no-deps dist/*.whl
          /tmp/vps-wheel-test/bin/python -m pip check
          /tmp/vps-wheel-test/bin/vps-opsec-auditor fixtures/safe.json --at 2026-10-09T01:00:00Z --format json --fail-on incomplete > /tmp/report.json
          python -c 'import json; r=json.load(open("/tmp/report.json")); assert r["synthetic"] and r["summary"]["pass"] == 10'
      - run: git diff --exit-code && git diff --check
