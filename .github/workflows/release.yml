name: Publish verified prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-v0.1.0a1
  cancel-in-progress: false
env:
  RELEASE_TAG: v0.1.0a1
  RELEASE_COMMIT: 069c2e93fc85fb45bc997f95e00730cef036a1c3
  RELEASE_ID: '407850186'
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v0.1.0a1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = mejustbox-byte/vps-opsec-auditor
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
      - run: bash scripts/setup_environment.sh
      - name: Build and verify reproducibility
        run: |
          set -euo pipefail
          .venv/bin/python scripts/build_release.py
          cp dist/SHA256SUMS /tmp/first-checksums
          .venv/bin/python scripts/build_release.py
          cmp dist/SHA256SUMS /tmp/first-checksums
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Scan public source for secrets
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/gitleaks /tmp/public-source
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
          tar -xzf dist/vps_opsec_auditor-0.1.0a1.tar.gz -C /tmp/public-source
          /tmp/gitleaks/gitleaks dir /tmp/public-source --no-banner --redact
      - name: Test installed wheel and unchanged checkout
        run: |
          set -euo pipefail
          python -m venv /tmp/release-wheel
          /tmp/release-wheel/bin/python -m pip install --no-index --no-deps dist/vps_opsec_auditor-0.1.0a1-py3-none-any.whl
          /tmp/release-wheel/bin/python -m pip check
          PYTHONPATH='' /tmp/release-wheel/bin/python -m unittest discover -s tests -v
          /tmp/release-wheel/bin/vps-opsec-auditor fixtures/safe.json --at 2026-10-09T01:00:00Z --format json --fail-on incomplete > /tmp/report.json
          python -c 'import json; r=json.load(open("/tmp/report.json")); assert r["synthetic"] and r["summary"]["pass"] == 10'
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-v0.1.0a1
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/vps_opsec_auditor-0.1.0a1-py3-none-any.whl
            dist/vps_opsec_auditor-0.1.0a1.tar.gz
            dist/SHA256SUMS
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-v0.1.0a1
          path: dist
      - name: Upload verified assets to existing release and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = mejustbox-byte/vps-opsec-auditor
          (cd dist && sha256sum -c SHA256SUMS)
          cat > /tmp/check-release.py <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1]))
          expected = {'vps_opsec_auditor-0.1.0a1-py3-none-any.whl', 'vps_opsec_auditor-0.1.0a1.tar.gz', 'SHA256SUMS'}
          assert data['id'] == int(os.environ['RELEASE_ID'])
          assert data['tag_name'] == os.environ['RELEASE_TAG']
          assert data['target_commitish'] == os.environ['RELEASE_COMMIT']
          assert data['prerelease'] is True
          names = {a['name'] for a in data['assets']}
          assert names <= expected and len(names) == len(data['assets'])
          assert all(a['size'] > 0 for a in data['assets'])
          if sys.argv[2] == 'published':
              assert data['draft'] is False and data['published_at'] and names == expected
          elif sys.argv[2] == 'ready':
              assert names == expected
          elif data['draft'] is False:
              assert names == expected, 'Never add files to an incomplete published release'
          for name in sorted(names):
              print(name)
          PY
          verify_tag() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /tmp/tag-ref.json
            object_sha=$(python -c 'import json; d=json.load(open("/tmp/tag-ref.json")); assert d["object"]["type"] == "tag"; print(d["object"]["sha"])')
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" > /tmp/tag-object.json
            python -c 'import json, os; d=json.load(open("/tmp/tag-object.json")); assert d["object"]["type"] == "commit" and d["object"]["sha"] == os.environ["RELEASE_COMMIT"]'
          }
          verify_tag
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /tmp/release-before.json
          python /tmp/check-release.py /tmp/release-before.json before > /tmp/existing-assets
          mkdir /tmp/existing-assets-dir
          while IFS= read -r asset; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir /tmp/existing-assets-dir
            cmp "dist/$asset" "/tmp/existing-assets-dir/$asset"
          done < /tmp/existing-assets
          for asset in vps_opsec_auditor-0.1.0a1-py3-none-any.whl vps_opsec_auditor-0.1.0a1.tar.gz SHA256SUMS; do
            if ! grep -Fxq "$asset" /tmp/existing-assets; then
              gh release upload "$RELEASE_TAG" "dist/$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done
          mkdir /tmp/downloaded-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/downloaded-assets
          (cd /tmp/downloaded-assets && sha256sum -c SHA256SUMS)
          for asset in vps_opsec_auditor-0.1.0a1-py3-none-any.whl vps_opsec_auditor-0.1.0a1.tar.gz SHA256SUMS; do
            cmp "dist/$asset" "/tmp/downloaded-assets/$asset"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /tmp/release-ready.json
          python /tmp/check-release.py /tmp/release-ready.json ready
          verify_tag
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --target "$RELEASE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /tmp/release-after.json
          python /tmp/check-release.py /tmp/release-after.json published
          verify_tag
